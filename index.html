<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="author" content="MaKyS0">
  <meta name="theme-color" content="#1f4e79">
  <title>Костанай БИЛ</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/dark.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <script src="js/theme-init.js"></script>
  <script src="vendor/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Перейти к содержимому</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Основное меню">
      <a class="brand" href="#/" title="На главную">
        <span class="brand-mark" aria-hidden="true">Б</span>
        <span class="brand-text"><strong id="brandName">Костанай БИЛ</strong><small id="brandSub">Информационная система</small></span>
      </a>
      <nav id="nav" aria-label="Разделы"></nav>
      <div class="sidebar-foot" id="storageFoot"><span id="storageNote"></span></div>
    </aside>
    <div class="backdrop" id="backdrop" hidden></div>
    <div class="main-col">
      <header class="topbar">
        <button class="btn btn-icon menu-btn" id="menuBtn" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Меню"></button>
        <form class="global-search" id="searchForm" role="search" autocomplete="off">
          <label class="sr-only" for="globalSearch">Поиск по ученикам, персоналу и классам</label>
          <input id="globalSearch" type="search" placeholder="Поиск: ученик, учитель, класс…" enterkeyhint="search"><kbd aria-hidden="true" title="Нажмите / чтобы начать поиск">/</kbd>
        </form>
        <div class="topbar-end">
          <span class="year-badge" id="yearBadge" title="Текущий учебный год"></span>
          <button class="sync-status" id="syncStatus" type="button"></button>
          <button class="theme-btn" id="themeBtn" type="button" aria-label="Тема оформления"></button>
        </div>
      </header>
      <div id="banner" class="banners"></div>
      <main id="view" tabindex="-1"><p class="loading">Загрузка…</p></main>
      <footer class="site-foot no-print"><span>Костанай БИЛ · внутренняя информационная система лицея</span><span>Разработчик <a href="https://github.com/MaKyS0" target="_blank" rel="noopener noreferrer">MaKyS0</a> · <a href="https://github.com/MaKyS0/Obhod_BIL" target="_blank" rel="noopener noreferrer">исходный код</a></span></footer>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite" role="status"></div>
</body>
</html>
